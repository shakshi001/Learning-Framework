<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
         body{
            margin:0;
            padding:0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
         }
         #container{
            height: 50%;
            width:40%;
            background-color: rgb(87, 87, 127);
            border-radius: 10px;
         }
         h2{
            text-align: center;
            font-size: 2.5vw;
            font-weight: bolder;
         }
         form{
            display: flex;
            flex-direction: column;
            align-items: center;
         }
         input{
            margin-bottom: 2.5vw;
            padding: 0.7vw;
            border-radius: 10px;
            border:1px solid black;
            width: 70%;
            font-weight: 700;
         }
         #btn{
            margin-top: 3vw;
            width:40%;
            background-color: rgb(160, 160, 184);
         }
         #btn:hover{
            background-color: rgb(95, 95, 138);
            cursor: pointer;
         }
    </style>
</head>
<body>
    <div id = "container">
        <h2>login</h2>
        <form>
            <input type="email" name="email" placeholder="enter email">
           
            <input type="password" name="password" placeholder="enter password">
            <input type="button" value="submit" id="btn">
        </form>
    </div>
</body>
</html>
