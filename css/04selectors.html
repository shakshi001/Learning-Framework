<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color:white;
        }
        .nav-container{
            margin-bottom: 40px;

        }
        h2{
            margin-bottom: 10px;

        }
        .nav1{
            /* border:2px solid red; */
            background-color: aliceblue;
            padding:10px;

        }
        .nav1 ul{
            list-style-type: none;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
        }
        .nav1 li{ 
            display:inline;
        }
        .nav1 a{
            text-decoration: none;
            color:black;
            /* background-color: #c69898; */
            padding: 5px 10px;
            position: relative;
        }
        .nav1 .login-btn{
            background-color: rgb(53, 53, 142);
            color:white;
            border:none;
            padding:5px 15px;
            border-radius: 5px;
            cursor:pointer;
        }
        .nav1 a::after{
          content:"";
          position: absolute;
          height: 2px;
          width:100%;
          bottom: 0;
          left:0;
          background-color: rgb(27, 27, 85);
          transform: scaleX(0);
          transition: transform 0.3s ease-in-out;

        }
        .nav1 a:hover::after{
           transform: scaleX(1);
        }

        .nav2{
            /* border: 2px solid red; */
            background-color: rgb(22, 104, 22);
            width:200px;
            padding:20px;

        }
        .nav2 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        .nav2 li{
            margin-bottom: 12px;
        }
        .nav2 a{
            text-decoration: none;
            color: white;
            display: block;
            padding: 10px;
            width:100%;
        }
        .nav2 a:hover{
           background-color: rgb(59, 178, 59);
        }
        .nav2 .login-btn{
            background-color: rgb(79, 214, 79);
            color:white;
            border:none;
            width:100%;
            padding:10px;
            cursor: pointer;
            margin-left: 5px;
            border-radius: 5px;
        }
        .nav2 .login-btn:hover{
            background-color: green;
            border:1px solid white;

        }
        .nav3{
            background-color: green;
            padding:10px;
        }
        .nav3 ul{
            list-style-type: none;
            padding:0;
            margin: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav3 a{
            text-decoration: none;
            color:#ffff;
            padding: 10px;
            display: block;
        }
        .nav3 .dropdown-content{
            display: none;
            color: #1a1a1a;
        }
        .nav3 .dropdown:hover .dropdown-content{
          display:block;
          position: absolute;
          background-color:rgb(30, 156, 30);
          /* color: #1a1a1a; */
          min-width:150px;
        }
        .dropdown-content a:hover 
        {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="nav-container">
        <h2>variation 1: Horizontal with underline effect </h2>
        <nav class="nav1">
           <ul>
              <li><a href="">Home</a></li>
              <li><a href="">About</a></li>
              <li><a href="">Product</a></li>
              <li><button class="login-btn">login</button></li>
           </ul>
        </nav>
    </div>
    <div class="nav-container">
        <h2>Variation 2: Vertical with hover effect</h2>
        <nav class="nav2">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Product</a></li>
            </ul>
            <button class="login-btn">login</button>
        </nav>
    </div>
     <div class="nav-container">
        <h2>Variation 3:Horizontal with dropdown</h2>
        <nav class="nav3">
            <ul>
                
                   <li><a href="">Home</a></li>
                   <li class="dropdown">
                       <a href="">About us</a>
                     <div class="dropdown-content">
                        <a href="">Our story</a>
                        <a href="">Team</a>
                        <a href="">Contact</a>
                    </div>
                </li>
                <li><a href="">Product</a></li>
                <li><button>login</button></li>
            </ul>
        </nav>
        
    </div>
</body>
</html>
