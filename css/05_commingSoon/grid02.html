<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid MasterClass</title>
    <style>
        body
        {
            margin: 0;
            padding: 20px;

            /* height: 100%;
            width: 100%; */
        }
        .container
        {
            /* height: 70vh;
            width: 25vw; */
            background-color: aqua;
            border: 1px soild black;
            margin-bottom: 10px;
        }
        .grid-container
        {
            display: grid;
            justify-content: center;
            align-items: center;
           background-color: orange;
           margin: 1vw;
           /* border: 3px solid black; */
        }
        .box
        { 
            /* height: 100%; */
            /* width:100%; */
            background-color: red;
            border: 4px solid black;
            margin: 1vw;
        }
    </style>
</head>
<body>
    <div class="container">
       <h2>Basic Grid</h2>
       <div class="grid-container"
        style=
        "grid-template-columns: repeat(3,1fr);     grid-template-rows: repeat(3,100px);">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
       </div>
    </div>
    <div class="container">
       <h2>2.grid with different column size</h2>
       <div class="grid-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
       </div>
    </div>
</body>
</html>
