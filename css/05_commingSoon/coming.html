<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Landing page</title>
    <style>
        body{
            margin: 0;
            padding:0;
            
        }
        .container
        {
            height: 100vh;
            width:100vw;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .content
        {
            height: 60vh;
            width:40vw;
            background-color: antiquewhite;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 10px;
        }
       .content img
       {
         height: 8vw;
         border-radius: 50%;
         margin-top: 2vw;
       }
       .content h2
       {
         text-align: center;
         margin: 0;
         padding: 0;
         font-size: 4vw;
       }
       .content p
       {
         text-align: center;
         font-size: 1.3vw;
         margin: 0;
         margin-bottom: 1vw;
       }
       .info
       {
        display: flex;
        flex-direction: column;
       }
       .info input
       {
         height: 2vw;
         width:30vw;
         margin: 1vw;
         padding: 0.355vw;
         border: none;
         font-weight: bolder;
       }
       .info button{
         margin-left: 4vw;
         height: 2vw;
         width: 25vw;
         border: none;
         background-color: rgba(179, 107, 13, 0.281);
         font-weight: bold;
         border-radius: 8px;
         padding:0.5vw;
       }
       .info button:hover
       {
          height: 3vw;
          width: 25.67vw;
          background-color: rgba(96, 62, 18, 0.614);
       }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="img">
                <img src="download (12).jpeg" alt="">
            </div>
            <div class="para">
                <h2>Coming Soon</h2>
                <p>We're working hard to bring
                  <br> something amazing.Stay tuned! 
                </p>
            </div>
            <div class="info">
                <input type="email" name="" placeholder="enter your email">
                <button>Notify Me</button>
            </div>
        </div>
    </div>
</body>
</html>
